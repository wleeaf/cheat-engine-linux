name: Wine compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-wine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install native and Wine32 dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            build-essential git pkg-config cmake ninja-build libcapstone-dev zlib1g-dev \
            libdw-dev ca-certificates python3 wine wine64 wine32:i386 xvfb xauth
      - name: Build compatibility tools without Qt
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON
          cmake --build build --target cescan wine_integration -j"$(nproc)"
      - name: Require real PE32 and PE32+ operations
        # Wine's server can create targets outside the driver's child tree.
        # Give this isolated test the same ptrace access as the WoW64 container.
        run: sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" xvfb-run -a python3 test/wine_compatibility_test.py build --require-legacy-wine32 --report compatibility-evidence/wine-legacy.json
      - name: Save operation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-legacy-evidence
          path: compatibility-evidence/*.json
          if-no-files-found: error

  wow64-wine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: fedora:44
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install dependencies
        run: |
          dnf install -y git gcc gcc-c++ pkgconf-pkg-config cmake ninja-build capstone-devel \
            zlib-devel elfutils-devel python3 wine xorg-x11-server-Xvfb xorg-x11-xauth
      - uses: actions/checkout@v7
      - name: Build compatibility tools without Qt
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON
          cmake --build build --target cescan wine_integration -j"$(nproc)"
      - name: Require actual 64-bit-loader WoW64 operations
        run: xvfb-run -a python3 test/wine_compatibility_test.py build --require-wow64 --report compatibility-evidence/wine-wow64.json
      - name: Save operation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-wow64-evidence
          path: compatibility-evidence/*.json
          if-no-files-found: error

  proton:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Pinned, redistributable Proton build; Valve's Proton needs a Steam login.
      GE_PROTON: GE-Proton11-7
      GE_PROTON_SHA256: c5448b76a230384e2d7bc6beb5ccb97bafb7e2c3b6c527cb03a1a546bbcb00a0
      # The Steam Linux Runtime 4 container GE-Proton11 declares (app 4183110).
      STEAM_RUNTIME: 4.0.20260805.254769
      STEAM_RUNTIME_SHA256: 3226d8234e7c0542ee767837832bfb1dad5e5e2dc944ec97eb221b437f6b9349
    steps:
      - uses: actions/checkout@v7
      - name: Install native and 32-bit loader dependencies
        # Proton's i386 Unix loader uses the host's 32-bit libraries outside the
        # Steam Runtime; wine32 pulls in exactly that set.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            build-essential git pkg-config cmake ninja-build libcapstone-dev zlib1g-dev \
            libdw-dev ca-certificates curl python3 wine32:i386 xvfb xauth
      - name: Download and verify Proton
        run: |
          curl -fsSL -o "$RUNNER_TEMP/proton.tar.gz" \
            "https://github.com/GloriousEggroll/proton-ge-custom/releases/download/$GE_PROTON/$GE_PROTON-x86_64.tar.gz"
          echo "$GE_PROTON_SHA256  $RUNNER_TEMP/proton.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/proton" && tar -xzf "$RUNNER_TEMP/proton.tar.gz" -C "$RUNNER_TEMP/proton"
          # Locate the launcher rather than assuming the archive's directory name.
          launcher=$(find "$RUNNER_TEMP/proton" -maxdepth 2 -type f -name proton | head -n1)
          test -n "$launcher"
          echo "PROTON_DIR=$(dirname "$launcher")" >> "$GITHUB_ENV"
      - name: Build compatibility tools without Qt
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON
          cmake --build build --target cescan wine_integration -j"$(nproc)"
      - name: Require real Proton PE32 and PE32+ operations
        run: sudo env GITHUB_SHA="$GITHUB_SHA" xvfb-run -a python3 test/proton_compatibility_gate.py build --proton "$PROTON_DIR" --report compatibility-evidence/proton.json
      - name: Download and verify the Steam Linux Runtime
        run: |
          curl -fsSL -o "$RUNNER_TEMP/runtime.tar.xz" \
            "https://repo.steampowered.com/steamrt4/images/$STEAM_RUNTIME/SteamLinuxRuntime_4.tar.xz"
          echo "$STEAM_RUNTIME_SHA256  $RUNNER_TEMP/runtime.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/runtime" && tar -xJf "$RUNNER_TEMP/runtime.tar.xz" -C "$RUNNER_TEMP/runtime"
          entry=$(find "$RUNNER_TEMP/runtime" -maxdepth 2 -type f -name _v2-entry-point | head -n1)
          test -n "$entry"
          echo "RUNTIME_DIR=$(dirname "$entry")" >> "$GITHUB_ENV"
      - name: Require the same operations with Proton inside the Steam Runtime container
        run: sudo env GITHUB_SHA="$GITHUB_SHA" xvfb-run -a python3 test/proton_compatibility_gate.py build --proton "$PROTON_DIR" --runtime "$RUNTIME_DIR" --report compatibility-evidence/proton-steam-runtime.json
      - name: Save operation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proton-evidence
          path: compatibility-evidence/*.json
          if-no-files-found: error
