name: ISA compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isa-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - isa: riscv64
            packages: g++-riscv64-linux-gnu qemu-system-misc opensbi
          - isa: s390x     # big-endian
            packages: g++-s390x-linux-gnu qemu-system-s390x
          - isa: ppc64el
            packages: g++-powerpc64le-linux-gnu qemu-system-ppc
    name: ${{ matrix.isa }}-guest
    steps:
      - uses: actions/checkout@v7
      - name: Install the cross compiler and full-system emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }} cmake ninja-build curl python3
      - name: Require process, scan, pointer, symbol and disassembly checks in a real guest
        run: CECORE_CI_JOBS="$(nproc)" tools/check-isa-vm.sh ${{ matrix.isa }} build/isa-vm/${{ matrix.isa }}
      - name: Save guest log and operation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.isa }}-guest-evidence
          path: |
            build/isa-vm/${{ matrix.isa }}/${{ matrix.isa }}-guest.json
            build/isa-vm/${{ matrix.isa }}/${{ matrix.isa }}-guest.log
          if-no-files-found: error
