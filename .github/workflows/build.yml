name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  arm64-compatibility:
    uses: ./.github/workflows/arm64-compatibility.yml

  wine-compatibility:
    uses: ./.github/workflows/wine-compatibility.yml

  isa-compatibility:
    uses: ./.github/workflows/isa-compatibility.yml

  x32-compatibility:
    uses: ./.github/workflows/x32-compatibility.yml

  ubuntu-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check coverage matrix is in sync
        run: python3 tools/coverage_matrix.py --check

      # Lua 5.3 is vendored under third_party/lua and built by CMake, so no
      # upstream checkout is needed — the repo is self-contained.
      - name: Install apt dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            build-essential \
            musl-tools \
            mgba-sdl xvfb xauth \
            nodejs \
            golang-go \
            openjdk-21-jdk-headless \
            bubblewrap \
            gcc-multilib \
            g++-multilib \
            libvulkan-dev \
            dbus \
            python3-dbus python3-gi \
            cmake \
            ninja-build \
            qemu-system-arm \
            mono-runtime-sgen mono-mcs libmonosgen-2.0-1 \
            qt6-base-dev \
            libcapstone-dev \
            zlib1g-dev \
            libdw-dev \
            libasound2-dev \
            libsoundtouch-dev \
            linux-headers-generic \
            ca-certificates

      - name: Cache FetchContent + build directory
        uses: actions/cache@v6
        with:
          path: |
            build/_deps
          key: cecore-deps-${{ runner.os }}-keystone-0.9.2-capstone-system-v2
          restore-keys: |
            cecore-deps-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCECORE_REQUIRE_NATIVE_CALL_I386=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run regression suite
        timeout-minutes: 15   # fail fast on a hang instead of burning the whole job
        run: |
          ./build/cecore_test
          ./build/cecore_deep_test
          ./build/cecore_compatibility_test
          ./build/table_persistence_integration
          python3 test/table_json_gate.py build --report build/compatibility-evidence/table-json.json
          python3 test/ceserver_compatibility_gate.py build --report build/compatibility-evidence/ceserver.json
          python3 test/gdb_transport_gate.py build --require-qemu --report build/compatibility-evidence/gdb-transport.json
          python3 test/elf_debug_gate.py build --require-i386 --report build/compatibility-evidence/elf-debug.json
          python3 test/autoasm_module_gate.py build --report build/compatibility-evidence/autoasm-modules.json
          python3 test/native_syscall_gate.py build --report build/compatibility-evidence/native-syscalls.json
          python3 test/code_write_gate.py build --output build/compatibility-evidence/code-write.log --report build/compatibility-evidence/code-write.json
          python3 test/memory_image_gate.py build --output build/compatibility-evidence/memory-image.log --report build/compatibility-evidence/memory-image.json
          python3 test/native_call_gate.py build --require-i386 --report build/compatibility-evidence/native-injector.json
          python3 test/mono_compatibility_gate.py build --report build/compatibility-evidence/mono-runtime.json
          python3 test/mono_compatibility_gate.py build --embedded --report build/compatibility-evidence/mono-embedded.json

      - name: Save native syscall and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-syscall-evidence
          path: |
            build/compatibility-evidence/autoasm-modules.json
            build/compatibility-evidence/native-syscalls.json
            build/compatibility-evidence/native-injector.json
            build/compatibility-evidence/mono-runtime.json
            build/compatibility-evidence/mono-embedded.json
            build/compatibility-evidence/elf-debug.json
            build/compatibility-evidence/gdb-transport.json
            build/compatibility-evidence/ceserver.json
            build/compatibility-evidence/table-json.json
            build/compatibility-evidence/code-write.json
            build/compatibility-evidence/code-write.log
          if-no-files-found: error

      - name: Run GUI debugger smoke test (offscreen Qt)
        run: |
          ./build/gui_debugger_smoke
          python3 test/gui_runtime_gate.py build --report build/compatibility-evidence/native-frontends.json
          python3 test/gui_runtime_gate.py build --leader-exit --report build/compatibility-evidence/native-frontends-leader-exit.json

      - name: Save native frontend logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-frontend-evidence
          path: build/compatibility-evidence/native-frontends*
          if-no-files-found: error

      - name: Run GUI theme smoke test (light/dark, offscreen Qt)
        run: ./build/gui_theme_smoke

      - name: Run GUI guest-scan and code-finder smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/gui_guest_scan_smoke
          ./build/gui_codefinder_smoke

      - name: Run GUI structure-dissector smoke test (compare mode, offscreen Qt)
        run: ./build/gui_structdissect_smoke

      - name: Run GUI pointer-scan smoke test (scan off the GUI thread, offscreen Qt)
        run: ./build/gui_pointerscan_smoke

      - name: Run GUI hex-view smoke test (changed-byte highlight, offscreen Qt)
        run: ./build/gui_hexview_smoke

      - name: Run GUI disassembler smoke test (range selection, offscreen Qt)
        run: ./build/gui_disasm_smoke

      - name: Run GUI memory-search smoke test (wildcard AOB, offscreen Qt)
        run: ./build/gui_search_smoke

      - name: Run GUI change-address dialog smoke test (Unicode/length, offscreen Qt)
        run: ./build/gui_changeaddr_smoke

      - name: Run GUI ownership and target lifecycle regression tests
        run: |
          ./build/gui_luaconsole_smoke
          ./build/gui_lifecycle_smoke
          python3 test/gui_injection_gate.py build --report build/compatibility-evidence/gui-injection.json
          python3 test/gdb_gui_gate.py build --require-qemu --report build/compatibility-evidence/gdb-gui.json

      - name: Run Wayland GlobalShortcuts portal test (mock portal, private bus)
        run: |
          if [ -x ./build/wayland_shortcuts_test ]; then
            dbus-run-session -- ./build/wayland_shortcuts_test
          else
            echo "wayland_shortcuts_test not built (Qt6::DBus absent) — skipped"
          fi

      - name: Run cross-process scan test (root)
        run: sudo env "LD_LIBRARY_PATH=$PWD/build" ./build/scan_test

      - name: Verify cescan launches
        run: ./build/cescan list | head -5

      - name: Run CLI usability workflows
        run: python3 test/cli_usability_test.py build/cescan

      - name: Run blocked-target refusal checks (CLI and Lua)
        run: python3 test/blocked_target_gate.py build

      - name: Run static/dynamic glibc, musl and i386 program workflows (CLI and Lua)
        run: |
          gcc -O1 -static -pthread -o build/static_fixture_glibc test/static_fixture.c
          musl-gcc -O1 -static -o build/static_fixture_musl test/static_fixture.c
          gcc -O1 -pthread -o build/dynamic_fixture_glibc test/static_fixture.c
          gcc -m32 -O1 -pthread -o build/dynamic_fixture_glibc32 test/static_fixture.c
          python3 test/frontend_target_gate.py build build/static_fixture_glibc build/static_fixture_musl \
            build/dynamic_fixture_glibc build/dynamic_fixture_glibc32 --gui --ceserver --report build/compatibility-evidence/libc-targets.json

      - name: Run a Go program through every frontend
        run: |
          (cd test/runtimes && CGO_ENABLED=0 go build -o ../../build/go_fixture go_fixture.go)
          python3 test/frontend_target_gate.py build build/go_fixture --gui --ceserver \
            --report build/compatibility-evidence/go-target.json

      - name: Run the same workflows on sandboxed programs (bubblewrap, Podman)
        # Ubuntu's AppArmor blocks unprivileged user namespaces for bwrap, so
        # that sandbox runs as root, without a user namespace (root inside one
        # cannot traverse the runner's home); the Podman workload is rootless and is a
        # dynamic musl program in its own Alpine root filesystem.
        run: |
          sudo python3 test/frontend_target_gate.py build build/static_fixture_musl build/dynamic_fixture_glibc \
            --launcher "bwrap --unshare-pid --unshare-ipc --unshare-net --unshare-uts --unshare-cgroup --die-with-parent --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp" \
            --gui --report build/compatibility-evidence/libc-bubblewrap.json
          musl-gcc -O1 -o build/dynamic_fixture_musl test/static_fixture.c
          podman pull -q docker.io/library/alpine:3.22
          python3 test/frontend_target_gate.py build build/dynamic_fixture_musl \
            --launcher "podman run --rm -i -v {dir}:{dir}:ro docker.io/library/alpine:3.22" \
            --gui --report build/compatibility-evidence/libc-podman.json

      - name: Run a strictly confined Snap program through every frontend
        # snap run --shell applies the snap's real AppArmor profile, seccomp
        # filter and mount namespace; its user-data directory is visible inside.
        run: |
          sudo snap install hello-world
          data="$HOME/snap/hello-world/current"
          mkdir -p "$data" && cp build/static_fixture_musl "$data/"
          python3 test/frontend_target_gate.py build "$data/static_fixture_musl" \
            --launcher "snap run --shell hello-world -c" --gui --report build/compatibility-evidence/libc-snap.json

      - name: Drive a real console emulator (mGBA, generated homebrew ROM)
        # Yama scope 1: only root may read an emulator that cescan did not start.
        run: sudo xvfb-run -a python3 test/emulator_target_gate.py build --gui --report build/compatibility-evidence/emulator-mgba.json

      - name: Drive the AI agent tools over MCP (cescan mcp)
        timeout-minutes: 5
        # Root: under Yama ptrace_scope 1 the server cannot read a game it did not start.
        run: sudo python3 test/mcp_gate.py build --report build/compatibility-evidence/mcp-agent.json

      - name: Run the AI Assistant panel (scripted model) and its keyring client (mock keyring)
        timeout-minutes: 5
        run: |
          QT_QPA_PLATFORM=offscreen ./build/gui_agent_smoke
          python3 test/secret_store_gate.py build --report build/compatibility-evidence/secret-store.json

      - name: Finish both tutorial games with the CLI and the agent tools
        timeout-minutes: 15
        # No root: the tutorials allow any tracer with PR_SET_PTRACER, as a game
        # meant to be practised on should.
        run: |
          python3 test/tutorial_gate.py build --report build/compatibility-evidence/tutorial-gate.json
          QT_QPA_PLATFORM=offscreen ./build/cetutorial --screenshots build/compatibility-evidence/tutorial-screens
          QT_QPA_PLATFORM=offscreen ./build/cegtutorial --screenshots build/compatibility-evidence/tutorial-screens

      - name: Save the tutorial results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-evidence
          path: |
            build/compatibility-evidence/tutorial-gate.json
            build/compatibility-evidence/tutorial-screens
          if-no-files-found: warn

      - name: Run JIT runtime workflows (Node/V8, HotSpot, Mono, CoreCLR)
        # Stock runtimes cannot opt in with PR_SET_PTRACER, so Yama scope 1
        # needs root to attach to them from a separately started tool.
        run: |
          # The C# fixture runs on Mono (--jitmap) and on the runner's .NET SDK.
          mcs -unsafe -r:System.dll -out:build/jit_fixture_mono.exe test/runtimes/JitFixture.cs
          dotnet new console -o build/jit-fixture-dotnet --force
          cp test/runtimes/JitFixture.cs build/jit-fixture-dotnet/Program.cs
          dotnet build build/jit-fixture-dotnet -c Release -p:AllowUnsafeBlocks=true -o build/jit-fixture-dotnet/out
          sudo python3 test/runtime_target_gate.py build --gui --mono-exe build/jit_fixture_mono.exe \
            --dotnet-dll build/jit-fixture-dotnet/out/jit-fixture-dotnet.dll --report build/compatibility-evidence/runtimes.json

      - name: Repeat the CoreCLR code-patch checks (JIT code placement varies run to run)
        run: |
          set -o pipefail
          for round in 1 2 3; do
            sudo python3 test/runtime_target_gate.py build --only coreclr \
              --dotnet-dll build/jit-fixture-dotnet/out/jit-fixture-dotnet.dll 2>&1 | sed "s/^/round $round: /"
          done

      - name: Build kernel module (out-of-tree)
        run: |
          set -e
          KDIR=/lib/modules/$(uname -r)/build
          if [ -d "$KDIR" ]; then
            make -C "$KDIR" M="$PWD/kernel" modules || \
              echo "kernel module build skipped: kernel headers missing required pieces on the runner"
          else
            echo "kernel module build skipped: $KDIR not present on the runner"
          fi
        # The runner image may not always ship matching kernel headers; the
        # main build is what's enforced.
        continue-on-error: true

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install apt dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            build-essential gcc-multilib cmake ninja-build libcapstone-dev \
            zlib1g-dev libdw-dev ca-certificates mono-runtime-sgen mono-mcs libmonosgen-2.0-1

      - name: Cache FetchContent (ASan)
        uses: actions/cache@v6
        with:
          path: build-asan/_deps
          key: cecore-asan-deps-${{ runner.os }}-keystone-0.9.2-v1

      - name: Configure (ASan + UBSan)
        run: cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCECORE_SANITIZE=ON

      # Only the non-GUI test targets. The debugger-fault and dlopen-inject tests
      # auto-skip under __SANITIZE_ADDRESS__ (they deliberately fault / inject,
      # which conflicts with the sanitizer runtime — not product bugs).
      - name: Build test targets (instrumented)
        run: cmake --build build-asan --target cecore_test cecore_deep_test cecore_compatibility_test table_persistence_integration table_json_integration elf_symbol_integration gdb_transport_integration ceserver_integration ceserver_connection_integration ceserver_multiclient_integration cescan target_syscall_integration code_write_integration memory_image_integration compatibility_integration compatibility_fixture64 compatibility_fixture32 native_call_integration native_call_image_integration native_call_exec_integration native_call_fixture native_call_library mono_integration mono_fixture_control cecore_mono_agent mono_limit_agent mono_embed_fixture speedhack -j"$(nproc)"

      - name: Run suite under ASan + UBSan
        timeout-minutes: 20   # fail fast on a hang instead of burning the whole job
        env:
          # Keystone's oversized MemoryBuffer allocations are patched to use
          # unsized delete, so type-mismatch checking remains enabled.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ./build-asan/cecore_test
          ./build-asan/cecore_deep_test
          ./build-asan/cecore_compatibility_test
          python3 test/autoasm_module_gate.py build-asan --report build-asan/compatibility-evidence/autoasm-modules.json
          ./build-asan/table_persistence_integration
          python3 test/table_json_gate.py build-asan --report build-asan/compatibility-evidence/table-json.json
          python3 test/ceserver_compatibility_gate.py build-asan --report build-asan/compatibility-evidence/ceserver.json
          python3 test/gdb_transport_gate.py build-asan --report build-asan/compatibility-evidence/gdb-transport.json
          python3 test/elf_debug_gate.py build-asan --require-i386 --report build-asan/compatibility-evidence/elf-debug.json
          python3 test/native_syscall_gate.py build-asan --report build-asan/compatibility-evidence/native-syscalls.json
          python3 test/code_write_gate.py build-asan --output build-asan/compatibility-evidence/code-write.log --report build-asan/compatibility-evidence/code-write.json
          python3 test/memory_image_gate.py build-asan --output build-asan/compatibility-evidence/memory-image.log --report build-asan/compatibility-evidence/memory-image.json
          python3 test/native_call_gate.py build-asan --report build-asan/compatibility-evidence/native-injector.json
          python3 test/mono_compatibility_gate.py build-asan --report build-asan/compatibility-evidence/mono-runtime.json
          python3 test/mono_compatibility_gate.py build-asan --embedded --report build-asan/compatibility-evidence/mono-embedded.json

      - name: Save sanitizer compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-compatibility-evidence
          path: build-asan/compatibility-evidence/*.json
          if-no-files-found: error
