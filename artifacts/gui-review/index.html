const settings=['Scan','Display','Debugger','Memory View','Hotkeys','Network','Symbols','CodeFinder','Lua','Unrandomizer','Plugins','Languages','Extra','Tools','Signing'];
const scenes=captures.after.filter(x=>x.file.startsWith('light-')).map(x=>x.file.slice(6,-4));
const name=s=>s.startsWith('settings-')?'Settings: '+settings[Number(s.slice(9))]:s.replaceAll('-',' ').replace(/^./,x=>x.toUpperCase());
for(const key of scenes){const option=document.createElement('option');option.value=key;option.textContent=name(key);scene.append(option)}
scene.value='main-populated';
function render(){document.body.classList.toggle('dark',theme.value==='dark');for(const stage of ['before','after']){const box=document.getElementById(stage);box.replaceChildren();const file=theme.value+'-'+scene.value+'.png';const capture=captures[stage].find(x=>x.file===file);if(!capture){box.textContent='No original capture for this view.';continue}const link=document.createElement('a');link.href=stage+'/'+file;const img=document.createElement('img');img.src=link.href;img.alt=stage+': '+name(scene.value)+' ('+theme.value+')';img.width=capture.width;img.height=capture.height;link.append(img);box.append(link)}}
function move(delta){scene.selectedIndex=(scene.selectedIndex+delta+scenes.length)%scenes.length;render()}
